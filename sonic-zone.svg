<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 200" width="800" height="200"
     role="img" aria-label="tiborequiem GitHub — GREEN HILL ZONE · ACT 1">
  <defs>
    <clipPath id="card"><rect width="800" height="200" rx="12"/></clipPath>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5BB8F5"/>
      <stop offset="100%" stop-color="#9DD8F9"/>
    </linearGradient>

    <!-- Classic Sonic 1 checkerboard ground -->
    <pattern id="checker" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#6B3800"/>
      <rect x="0"  y="0"  width="16" height="16" fill="#9A5200"/>
      <rect x="16" y="16" width="16" height="16" fill="#9A5200"/>
    </pattern>

    <style>
      /* HUD font — monospace approximates the Sonic bitmap font */
      .hud-lbl {
        font: 600 9px 'Courier New', Courier, monospace;
        fill: #94A3B8; letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .hud-val {
        font: 700 16px 'Courier New', Courier, monospace;
        fill: #FFFFFF;
      }
      .zone-name {
        font: 700 10px 'Courier New', Courier, monospace;
        fill: #4ADE80; letter-spacing: 1px;
      }
      .mode-val {
        font: 700 13px 'Courier New', Courier, monospace;
        fill: #4ADE80; letter-spacing: 1px;
      }
      .em-lbl {
        font: 600 8px 'Courier New', Courier, monospace;
        fill: #4B5563; letter-spacing: 1.5px;
      }

      /* Ground scroll */
      .ground { animation: gscroll 0.85s linear infinite; }

      /* Ring squish — transform-box keeps origin centred on each ring */
      .ring-spin {
        transform-box: fill-box;
        transform-origin: center;
        animation: rspin 0.65s ease-in-out infinite;
      }

      @keyframes gscroll {
        from { transform: translateX(0);    }
        to   { transform: translateX(-32px); }
      }
      @keyframes rspin {
        0%,100% { transform: scaleX(1);   }
        50%     { transform: scaleX(0.08); }
      }
      @keyframes twinkle {
        from { opacity: 0.1; }
        to   { opacity: 0.9; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">

    <!-- ░░ SKY ░░ -->
    <rect width="800" height="200" fill="url(#sky)"/>

    <!-- Stars / clouds -->
    
    <g opacity="0.95"><ellipse cx="118" cy="72" rx="30" ry="16" fill="white"/><ellipse cx="142" cy="65" rx="20" ry="14" fill="white"/><ellipse cx="96" cy="67" rx="18" ry="12" fill="white"/><ellipse cx="390" cy="62" rx="22" ry="12" fill="white"/><ellipse cx="408" cy="57" rx="15" ry="10" fill="white"/><ellipse cx="374" cy="59" rx="13" ry="9" fill="white"/><ellipse cx="636" cy="70" rx="33" ry="17" fill="white"/><ellipse cx="662" cy="63" rx="22" ry="15" fill="white"/><ellipse cx="612" cy="65" rx="19" ry="13" fill="white"/></g>

    <!-- ░░ HILLS ░░ -->
    <path d="M0,147 C40,147 70,88 155,88 C240,88 270,147 360,147          C450,147 480,84 565,84 C650,84 680,147 800,147 Z" fill="#2DB447" stroke="#1A8A2E" stroke-width="1.5"/>
    <path d="M0,147 C30,147 55,116 115,116 C175,116 200,147 270,147          C340,147 365,112 435,112 C505,112 530,147 610,147          C680,147 710,118 775,118 C800,118 800,138 800,147 Z" fill="#208A38" stroke="#135E22" stroke-width="1"/>

    <!-- ░░ GROUND ░░ -->
    <g class="ground">
      <rect x="-32" y="147" width="864" height="53" fill="url(#checker)"/>
      <!-- Grass strip -->
      <rect x="-32" y="143" width="864" height="6" fill="#29C242"/>
      <!-- Specular highlight on grass -->
      <rect x="-32" y="143" width="864" height="2" fill="#52E870" opacity="0.7"/>
    </g>

    <!-- ░░ RINGS ░░ -->
    <g transform="translate(210,130)">  <g class="ring-spin">    <circle cx="0" cy="0" r="11" fill="none" stroke="#F9C200" stroke-width="4.5"/>    <circle cx="0" cy="0" r="11" fill="none" stroke="#FFF5A0" stroke-width="1.5"            stroke-dasharray="8 14" stroke-linecap="round"/>  </g></g><g transform="translate(305,130)">  <g class="ring-spin">    <circle cx="0" cy="0" r="11" fill="none" stroke="#F9C200" stroke-width="4.5"/>    <circle cx="0" cy="0" r="11" fill="none" stroke="#FFF5A0" stroke-width="1.5"            stroke-dasharray="8 14" stroke-linecap="round"/>  </g></g><g transform="translate(400,130)">  <g class="ring-spin">    <circle cx="0" cy="0" r="11" fill="none" stroke="#F9C200" stroke-width="4.5"/>    <circle cx="0" cy="0" r="11" fill="none" stroke="#FFF5A0" stroke-width="1.5"            stroke-dasharray="8 14" stroke-linecap="round"/>  </g></g><g transform="translate(495,130)">  <g class="ring-spin">    <circle cx="0" cy="0" r="11" fill="none" stroke="#F9C200" stroke-width="4.5"/>    <circle cx="0" cy="0" r="11" fill="none" stroke="#FFF5A0" stroke-width="1.5"            stroke-dasharray="8 14" stroke-linecap="round"/>  </g></g><g transform="translate(590,130)">  <g class="ring-spin">    <circle cx="0" cy="0" r="11" fill="none" stroke="#F9C200" stroke-width="4.5"/>    <circle cx="0" cy="0" r="11" fill="none" stroke="#FFF5A0" stroke-width="1.5"            stroke-dasharray="8 14" stroke-linecap="round"/>  </g></g>

    <!-- ══════════════════════════════════════════
         TOP HUD BAR  (Sonic 1-style: SCORE / RINGS / TIME / STREAK)
         ══════════════════════════════════════════ -->
    <rect width="800" height="46" fill="#000000" opacity="0.72"/>
    <!-- Zone-coloured bottom edge of bar -->
    <rect y="45" width="800" height="1.5" fill="#4ADE80" opacity="0.55"/>

    <!-- SCORE -->
    <text x="24"  y="17" class="hud-lbl">SCORE</text>
    <text x="24"  y="37" class="hud-val">100</text>

    <!-- RINGS / 7D -->
    <text x="196" y="17" class="hud-lbl">RINGS · 7D</text>
    <text x="196" y="37" class="hud-val">3</text>

    <!-- RINGS / 30D -->
    <text x="348" y="17" class="hud-lbl">RINGS · 30D</text>
    <text x="348" y="37" class="hud-val">25</text>

    <!-- STREAK -->
    <text x="500" y="17" class="hud-lbl">STREAK</text>
    <text x="500" y="37" class="hud-val">3 DAYS</text>

    <!-- Zone name — right aligned -->
    <text x="778" y="22" class="zone-name" text-anchor="end">GREEN HILL ZONE</text>
    <text x="778" y="38" class="zone-name" text-anchor="end" style="fill:#64748B">ACT 1</text>

    <!-- ══════════════════════════════════════════
         BOTTOM HUD BAR  (MODE + CHAOS EMERALDS)
         ══════════════════════════════════════════ -->
    <rect y="154" width="800" height="46" fill="#000000" opacity="0.72"/>
    <!-- Zone-coloured top edge of bar -->
    <rect y="154" width="800" height="1.5" fill="#4ADE80" opacity="0.55"/>

    <!-- Mode -->
    <text x="24"  y="171" class="em-lbl">MODE</text>
    <text x="24"  y="188" class="mode-val">CRUISING</text>

    <!-- Chaos Emeralds -->
    <text x="574" y="161" class="em-lbl">CHAOS EMERALDS  (3/7)</text>
    <polygon points="574,163 583,175 574,187 565,175" fill="#38BDF8" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"/><polygon points="604,163 613,175 604,187 595,175" fill="#F9C200" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"/><polygon points="634,163 643,175 634,187 625,175" fill="#EF4444" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"/><polygon points="664,163 673,175 664,187 655,175" fill="none" stroke="#2D3748" stroke-width="1"/><polygon points="694,163 703,175 694,187 685,175" fill="none" stroke="#2D3748" stroke-width="1"/><polygon points="724,163 733,175 724,187 715,175" fill="none" stroke="#2D3748" stroke-width="1"/><polygon points="754,163 763,175 754,187 745,175" fill="none" stroke="#2D3748" stroke-width="1"/>

  </g>

  <!-- Card border -->
  <rect width="800" height="200" rx="12" fill="none"
        stroke="#4ADE80" stroke-width="1.5" opacity="0.35"/>
</svg>