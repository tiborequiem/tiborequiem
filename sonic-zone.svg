<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 220" width="800" height="220"
     role="img" aria-label="tiborequiem GitHub Activity – GREEN HILL ZONE">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#78350F"/>
      <rect width="14" height="14" fill="#92400E"/>
      <rect x="14" y="14" width="14" height="14" fill="#92400E"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .hud-key { font: 600 10px 'Courier New', monospace; fill: #FACC15;
                  letter-spacing: 1px; text-transform: uppercase; }
      .hud-val { font: 700 11px 'Courier New', monospace; fill: #FFFFFF; }
      .em-label { font: 600 9px  'Courier New', monospace; fill: #CBD5E1;
                   letter-spacing: 1.5px; }

      .ground   { animation: ground-scroll 0.70s linear infinite; }
      .ring-trk { animation: ring-scroll 3.2s linear infinite;   }
      .sonic    { animation: bob 0.40s ease-in-out infinite; }
      .ring-spin{ animation: spin 0.65s ease-in-out infinite; }
      .aura     { animation: pulse 0.55s ease-in-out infinite alternate; }
      .twinkle  { animation: pulse 2s ease-in-out infinite alternate; }
      .orbit    { animation: orbit-spin 3s linear infinite; transform-origin: 0 0; }

      @keyframes ground-scroll{
        from{ transform: translateX(0);   }
        to  { transform: translateX(-28px); }
      }
      @keyframes ring-scroll{
        from{ transform: translateX(0);     }
        to  { transform: translateX(-660px); }
      }
      @keyframes bob{
        0%,100%{ transform: translateY(0px);   }
        50%    { transform: translateY(-5px);  }
      }
      @keyframes spin{
        0%,100%{ transform: scaleX(1);  }
        50%    { transform: scaleX(0.15); }
      }
      @keyframes pulse{
        from{ opacity: 0.2; }
        to  { opacity: 0.85; }
      }
      @keyframes orbit-spin{
        from{ transform: rotate(0deg);   }
        to  { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="800" height="220" rx="10" fill="url(#sky)"/>

  <!-- Stars / clouds -->
  
  
  <g opacity="0.85">
    <ellipse cx="120" cy="52" rx="40" ry="18" fill="white"/>
    <ellipse cx="145" cy="44" rx="28" ry="20" fill="white"/>
    <ellipse cx="96"  cy="50" rx="24" ry="14" fill="white"/>

    <ellipse cx="560" cy="38" rx="50" ry="20" fill="white"/>
    <ellipse cx="590" cy="30" rx="34" ry="22" fill="white"/>
    <ellipse cx="532" cy="36" rx="28" ry="16" fill="white"/>
  </g>

  <!-- Background hills -->
  <path d="M0,168 Q80,110 170,145 Q260,110 360,152 Q440,120 540,155
           Q620,118 720,148 Q760,135 800,142 L800,168 Z"
        fill="#15803D" opacity="0.6"/>
  <path d="M0,168 Q60,138 130,155 Q200,138 290,160 Q370,142 460,162
           Q540,146 640,158 Q700,146 800,154 L800,168 Z"
        fill="#16A34A" opacity="0.75"/>

  <!-- Scrolling ground -->
  <g class="ground">
    <rect x="-28" y="168" width="856" height="52" fill="url(#checker)"/>
    <rect x="-28" y="164" width="856" height="6"  fill="#15803D"/>
    <rect x="-28" y="164" width="856" height="2"  fill="#4ADE80"/>
  </g>

  <!-- Rings -->
  <g class="ring-trk">
    <g transform="translate(320,148)">  <g class="ring-spin">    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FACC15" stroke-width="4"/>    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FEF08A" stroke-width="1.5"            stroke-dasharray="12 20"/>  </g></g><g transform="translate(430,148)">  <g class="ring-spin">    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FACC15" stroke-width="4"/>    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FEF08A" stroke-width="1.5"            stroke-dasharray="12 20"/>  </g></g><g transform="translate(540,148)">  <g class="ring-spin">    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FACC15" stroke-width="4"/>    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FEF08A" stroke-width="1.5"            stroke-dasharray="12 20"/>  </g></g><g transform="translate(650,148)">  <g class="ring-spin">    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FACC15" stroke-width="4"/>    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FEF08A" stroke-width="1.5"            stroke-dasharray="12 20"/>  </g></g><g transform="translate(760,148)">  <g class="ring-spin">    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FACC15" stroke-width="4"/>    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FEF08A" stroke-width="1.5"            stroke-dasharray="12 20"/>  </g></g><g transform="translate(870,148)">  <g class="ring-spin">    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FACC15" stroke-width="4"/>    <circle cx="0" cy="0" r="13" fill="none"            stroke="#FEF08A" stroke-width="1.5"            stroke-dasharray="12 20"/>  </g></g>
  </g>

  <!-- Speed lines (behind Sonic) -->
  

  <!-- Sonic (animated bob) -->
  <g class="sonic">
    
  <g transform="translate(175,108)">
    
    

    <!-- Back arm (behind body) -->
    <path d="M-6,8 Q-24,20 -26,32"
          fill="none" stroke="#1E3A8A" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-26" cy="32" r="9" fill="#E8E8F0"/>
    <path d="M-32,28 Q-30,22 -24,26" fill="none"
          stroke="#C8C8D8" stroke-width="1.2" stroke-linecap="round"/>

    <!-- TAIL -->
    <path d="M-20,4 Q-38,-4 -34,-20 Q-28,-32 -16,-22"
          fill="#2563EB" stroke="#1E3A8A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- BODY -->
    <ellipse cx="-2" cy="12" rx="22" ry="20" fill="#2563EB"/>

    <!-- BELLY -->
    <ellipse cx="8" cy="16" rx="13" ry="13" fill="#FCD9A0"/>

    <!-- NECK -->
    <path d="M-8,0 Q-4,-8 4,-8 Q10,-8 12,0" fill="#2563EB"/>

    <!-- HEAD (large, slightly tilted forward — classic Sonic proportion) -->
    <path d="
      M-8,-38
      Q-4,-58 12,-60
      Q28,-60 36,-48
      Q44,-36 40,-22
      Q36,-8  24,-4
      Q12,0   4,0
      Q-6,0  -12,-6
      Q-20,-14 -18,-26
      Q-16,-34 -8,-38 Z"
      fill="#2563EB" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- SPINES (3, swept back-left, classic Sonic silhouette) -->
    <path d="M-4,-44 Q-28,-58 -44,-52 Q-30,-42 -14,-38 Z"
          fill="#1E3A8A"/>
    <path d="M4,-50 Q-14,-68 -32,-66 Q-20,-54 -6,-44 Z"
          fill="#1E3A8A"/>
    <path d="M14,-52 Q2,-72 -16,-74 Q-8,-58 4,-46 Z"
          fill="#1E3A8A"/>

    <!-- EAR -->
    <path d="M-10,-42 Q-20,-58 -10,-64 Q-2,-60 -4,-44 Z" fill="#2563EB"/>
    <path d="M-10,-44 Q-18,-56 -10,-60 Q-5,-58 -6,-46 Z" fill="#E8899A"/>

    <!-- MUZZLE -->
    <ellipse cx="30" cy="-20" rx="13" ry="10" fill="#FCD9A0"/>

    <!-- NOSE -->
    <ellipse cx="41" cy="-26" rx="4" ry="3"
             fill="#1A1A2E" transform="rotate(-10,41,-26)"/>

    <!-- EYE — white, iris, pupil, shine, brow -->
    <ellipse cx="18" cy="-34" rx="11" ry="13" fill="white"/>
    <ellipse cx="20" cy="-33" rx="7.5" ry="9" fill="#22C55E"/>
    <ellipse cx="22" cy="-35" rx="4.5" ry="6" fill="#0F172A"/>
    <circle cx="19" cy="-38" r="2.5" fill="white"/>
    <!-- Confident brow -->
    <path d="M8,-44 Q18,-50 28,-43"
          fill="none" stroke="#1E3A8A" stroke-width="3"
          stroke-linecap="round"/>

    <!-- MOUTH / smirk -->
    <path d="M28,-14 Q34,-10 38,-14"
          fill="none" stroke="#C2410C" stroke-width="2"
          stroke-linecap="round"/>

    <!-- Front arm (pointing forward/down) -->
    <path d="M10,4 Q28,2 34,16"
          fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
    <circle cx="34" cy="16" r="10" fill="white"/>
    <path d="M26,12 Q32,8 38,14"
          fill="none" stroke="#C8C8D8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- LEGS (running stride) -->
    <!-- Back leg -->
    <path d="M-8,28 Q-18,46 -22,62"
          fill="none" stroke="#1E3A8A" stroke-width="11" stroke-linecap="round"/>
    <!-- Front leg (lunging forward) -->
    <path d="M8,28 Q20,42 28,56"
          fill="none" stroke="#2563EB" stroke-width="11" stroke-linecap="round"/>

    <!-- SHOES — red with white strap + dark buckle -->
    <!-- Back shoe -->
    <ellipse cx="-24" cy="68" rx="15" ry="8" fill="#B91C1C"/>
    <rect x="-38" y="62" width="26" height="7" rx="3" fill="#DC2626"/>
    <rect x="-32" y="61" width="16" height="4" rx="2" fill="white"/>
    <circle cx="-38" cy="65" r="3" fill="#7F1D1D"/>
    <path d="M-38,62 L-38,68" stroke="#7F1D1D" stroke-width="1.5"/>

    <!-- Front shoe -->
    <ellipse cx="30" cy="62" rx="17" ry="9" fill="#DC2626"/>
    <rect x="16" y="56" width="30" height="8" rx="3" fill="#EF4444"/>
    <rect x="20" y="55" width="20" height="4" rx="2" fill="white"/>
    <circle cx="46" cy="60" r="3" fill="#7F1D1D"/>
    <path d="M46,56 L46,62" stroke="#7F1D1D" stroke-width="1.5"/>
  </g>
  </g>

  <!-- Top bar: zone name + emeralds -->
  <rect x="0" y="0" width="800" height="22" rx="10" fill="#000000" opacity="0.40"
        style="border-radius:10px 10px 0 0;"/>
  <text x="14" y="14" class="em-label">GREEN HILL ZONE · ACT 1</text>
  <text x="558" y="14" class="em-label">CHAOS EMERALDS</text>
  <polygon points="606,23 615,32 606,45 597,32" fill="#38BDF8" stroke="white" stroke-width="1.2"/><polygon points="632,23 641,32 632,45 623,32" fill="#FACC15" stroke="white" stroke-width="1.2"/><polygon points="658,23 667,32 658,45 649,32" fill="#EF4444" stroke="white" stroke-width="1.2"/><polygon points="684,23 693,32 684,45 675,32" fill="none" stroke="#64748B" stroke-width="1" opacity="0.4"/><polygon points="710,23 719,32 710,45 701,32" fill="none" stroke="#64748B" stroke-width="1" opacity="0.4"/><polygon points="736,23 745,32 736,45 727,32" fill="none" stroke="#64748B" stroke-width="1" opacity="0.4"/><polygon points="762,23 771,32 762,45 753,32" fill="none" stroke="#64748B" stroke-width="1" opacity="0.4"/>

  <!-- HUD -->
  
  <!-- HUD bar -->
  <rect x="0" y="178" width="800" height="42" fill="#000000" opacity="0.52"/>
  <line x1="0" y1="178" x2="800" y2="178" stroke="#FACC15" stroke-width="1.5" opacity="0.6"/>

  <text x="16"  y="192" class="hud-key">SCORE</text>
  <text x="68"  y="192" class="hud-val">100</text>

  <text x="16"  y="208" class="hud-key">RINGS·7D</text>
  <text x="90"  y="208" class="hud-val">3</text>

  <text x="200" y="192" class="hud-key">RINGS·30D</text>
  <text x="278" y="192" class="hud-val">25</text>

  <text x="200" y="208" class="hud-key">STREAK</text>
  <text x="258" y="208" class="hud-val">3D</text>

  <text x="380" y="192" class="hud-key">ZONE</text>
  <text x="416" y="192" class="hud-val">GREEN HILL ZONE</text>

  <text x="380" y="208" class="hud-key">MODE</text>
  <text x="416" y="208" class="hud-val">CRUISING</text>

</svg>